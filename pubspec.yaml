name: donaeduca
description: App de donaciones para instituciones educativas.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  image_picker: ^1.0.7
  http: ^1.1.0
  google_fonts: ^6.1.0
  intl: ^0.18.1
  flutter_dotenv: ^5.1.0
  path: ^1.8.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
