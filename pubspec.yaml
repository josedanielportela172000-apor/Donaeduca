name: donaeduca
description: App de donaciones para instituciones educativas.
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  image_picker: ^1.0.7
  http: ^1.1.0
  google_fonts: ^6.1.0
  intl: ^0.18.1
  flutter_dotenv: ^5.1.0
  path: ^1.8.0
  firebase_messaging: ^15.2.10
  firebase_app_check: ^0.3.1+4
  flutter_local_notifications: ^22.2.0
  url_launcher: ^6.3.2
  google_sign_in: ^6.2.2
  pdf: ^3.12.0
  printing: ^5.14.3
  fl_chart: ^1.2.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  mobile_scanner: ^7.4.1
  qr_flutter: ^4.1.0
  geocoding: ^5.0.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#16884b"
